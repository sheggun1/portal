<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTMC Result Management System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f4f6f9;color:#1a1a2e;line-height:1.5}
.hidden{display:none!important}

/* LOGIN */
.login-wrap{max-width:420px;margin:60px auto;padding:32px;background:#fff;border-radius:14px;box-shadow:0 6px 28px rgba(0,0,0,.08)}
.login-wrap h1{font-size:22px;margin-bottom:6px;color:#1f4e79}
.login-wrap .sub{font-size:14px;color:#666;margin-bottom:24px}

/* APP SHELL */
.app{max-width:1100px;margin:0 auto;padding:16px}
.topbar{background:#1f4e79;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-radius:10px;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.topbar .who{font-size:15px;font-weight:600}
.topbar .role{opacity:.7;font-size:13px}
.topbar .menu{position:relative}
.topbar button{background:rgba(255,255,255,.15);font-size:14px;padding:8px 14px;border:none;border-radius:8px;color:#fff;cursor:pointer;font-family:inherit}
.topbar button:hover{background:rgba(255,255,255,.25)}
.dropdown{position:absolute;right:0;top:100%;margin-top:6px;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);min-width:220px;padding:6px;z-index:50}
.dropdown a{display:block;padding:10px 14px;color:#1a1a2e;text-decoration:none;border-radius:6px;font-size:14px;cursor:pointer}
.dropdown a:hover{background:#f3f4f6}

/* TABS */
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;flex-wrap:wrap}
.tabs button{padding:10px 14px;background:#fff;border:1px solid #d1d5db;border-radius:8px;font-size:13px;font-weight:600;color:#333;cursor:pointer;white-space:nowrap;font-family:inherit}
.tabs button.active{background:#1f4e79;color:#fff;border-color:#1f4e79}
.tabs button:hover:not(.active){background:#f3f4f6}

/* CARDS */
.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card h2{font-size:18px;margin-bottom:14px;color:#1f4e79}
.card h3{font-size:15px;margin-bottom:10px;color:#333}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.card-header h2{margin:0}

/* BUTTONS */
button.btn{padding:11px 16px;background:#1f4e79;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
button.btn:hover{background:#17416b}
button.btn:disabled{opacity:.6;cursor:not-allowed}
button.btn.secondary{background:#64748b}
button.btn.secondary:hover{background:#475569}
button.btn.danger{background:#dc2626}
button.btn.danger:hover{background:#b91c1c}
button.btn.success{background:#16a34a}
button.btn.success:hover{background:#15803d}
button.btn.warn{background:#ca8a04}
button.btn.warn:hover{background:#a16207}
button.btn.block{width:100%}
button.btn.small{padding:7px 12px;font-size:12px}

/* FORMS */
input,select,textarea{width:100%;padding:11px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1f4e79;box-shadow:0 0 0 3px rgba(31,78,121,.1)}
input:disabled,select:disabled{background:#f3f4f6;color:#6b7280}
label{display:block;font-size:13px;color:#555;margin-bottom:6px;font-weight:600}
.field{margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* BOXES */
.error-box{background:#fee;color:#900;padding:12px;border-radius:8px;font-size:14px;margin-bottom:14px;border-left:4px solid #dc2626}
.info-box{background:#e0f2fe;color:#075985;padding:12px;border-radius:8px;font-size:14px;margin-bottom:14px;border-left:4px solid #0ea5e9}
.success-box{background:#dcfce7;color:#166534;padding:12px;border-radius:8px;font-size:14px;margin-bottom:14px;border-left:4px solid #16a34a}
.warn-box{background:#fef3c7;color:#92400e;padding:12px;border-radius:8px;font-size:14px;margin-bottom:14px;border-left:4px solid #ca8a04}
.meta{color:#666;font-size:13px}

/* TABLES */
.tbl-wrap{overflow-x:auto;margin:0 -20px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:500px}
.tbl th{background:#f3f4f6;padding:10px 12px;text-align:left;font-size:12px;text-transform:uppercase;color:#555;font-weight:700;border-bottom:2px solid #e5e7eb;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid #eee;vertical-align:middle}
.tbl tr:hover{background:#fafafa}
.tbl code{font-family:ui-monospace,monospace;font-size:12px;background:#f3f4f6;padding:2px 6px;border-radius:4px;color:#1f4e79}

/* SCORE ENTRY */
.progress{background:#e5e7eb;height:10px;border-radius:5px;overflow:hidden;margin:10px 0}
.progress > div{background:#1f4e79;height:100%;transition:width .3s;width:0}
.student-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #eee}
.student-row:last-child{border-bottom:none}
.student-name{flex:1;font-size:15px;font-weight:500}
.student-id{color:#888;font-size:12px;font-family:monospace}
.score-input{width:90px;padding:10px;font-size:18px;font-weight:700;text-align:center;border:2px solid #d1d5db;border-radius:8px}
.score-input:focus{border-color:#1f4e79;box-shadow:0 0 0 3px rgba(31,78,121,.15)}
.score-input.error{border-color:#dc2626;background:#fee}
.score-input.saved{border-color:#16a34a}
.status{font-size:12px;min-width:80px;text-align:right;font-weight:600}
.status.saved{color:#16a34a}
.status.pending{color:#ca8a04}
.status.error{color:#dc2626}

/* BADGES */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;white-space:nowrap}
.badge.pending{background:#fef3c7;color:#92400e}
.badge.approved{background:#dcfce7;color:#166534}
.badge.returned{background:#fee2e2;color:#991b1b}
.badge.draft{background:#e5e7eb;color:#374151}
.badge.submitted{background:#dbeafe;color:#1e40af}
.badge.active{background:#dcfce7;color:#166534}
.badge.inactive{background:#f3f4f6;color:#6b7280}
.badge.red{background:#fee2e2;color:#991b1b}
.badge.blue{background:#dbeafe;color:#1e40af}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal{background:#fff;border-radius:12px;padding:24px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;margin:auto}
.modal.lg{max-width:900px}
.modal h3{margin-bottom:14px;color:#1f4e79;font-size:18px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.modal .actions button{min-width:100px}

/* SUB ITEMS */
.sub-item{padding:14px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:10px;background:#fff}
.sub-item .line1{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:8px}
.sub-item .title{font-weight:700;color:#1f4e79}
.sub-item .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* LOADING */
.loading{display:inline-block;width:14px;height:14px;border:2px solid #d1d5db;border-top-color:#1f4e79;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner-center{text-align:center;padding:40px 20px}
.spinner-center .loading{width:24px;height:24px;border-width:3px}

/* CHECKBOXES */
.checkbox-wrap{display:flex;align-items:center;gap:8px;padding:8px 0}
.checkbox-wrap input[type=checkbox]{width:20px;height:20px;accent-color:#1f4e79;cursor:pointer;margin:0}
.checkbox-wrap label{margin:0;cursor:pointer;font-weight:500;color:#333;font-size:14px}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;color:#fff;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast.info{background:#0ea5e9}
.toast.success{background:#16a34a}
.toast.error{background:#dc2626}
.toast.warn{background:#ca8a04}

/* REPORT CARD */
.rc-wrap{background:#fff;padding:24px;border-radius:8px;overflow-x:auto}
.rc-header{text-align:center;margin-bottom:20px;border-bottom:2px solid #1f4e79;padding-bottom:14px}
.rc-header h1{font-size:20px;color:#1f4e79;margin-bottom:4px}
.rc-header .rc-motto{font-size:13px;font-style:italic}
.rc-header .rc-title{margin-top:8px;font-weight:700;text-transform:uppercase;font-size:13px;padding:6px 10px;border-radius:4px;display:inline-block}
.rc-student-info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;font-size:14px}
.rc-student-info .row-info{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted #ddd}
.rc-subject-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px}
.rc-subject-table th,.rc-subject-table td{border:1px solid #333;padding:5px 6px;text-align:center}
.rc-subject-table th{font-weight:700;font-size:11px}
.rc-subject-table td.subject-name{text-align:left;font-weight:600}
.rc-section{margin-top:20px;border:1px solid #333;border-radius:6px;overflow:hidden}
.rc-section h4{padding:8px 12px;font-size:13px;text-transform:uppercase}
.rc-section .rc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0}
.rc-section .rc-grid > div{padding:8px 12px;border-bottom:1px solid #eee;border-right:1px solid #eee;font-size:13px;display:flex;justify-content:space-between}
.rc-sig-line{border-top:1px solid #333;padding-top:8px;font-size:13px;text-align:center}

@media print{
  body{background:#fff;padding:0}
  .topbar,.tabs,.no-print{display:none!important}
  .app{max-width:100%;padding:0}
  .card{box-shadow:none;border-radius:0;padding:0;margin:0}
  .rc-wrap{padding:0}
}

@media (max-width:640px){
  .app{padding:10px}
  .card{padding:14px}
  .row-2,.row-3,.row-4{grid-template-columns:1fr}
  .student-row{gap:8px}
  .score-input{width:70px;padding:8px;font-size:16px}
  .status{min-width:60px;font-size:11px}
  .tabs button{padding:8px 12px;font-size:12px}
  .topbar .who{font-size:14px}
  .modal{padding:18px}
  .rc-student-info{grid-template-columns:1fr}
  .rc-section .rc-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="view-login" class="login-wrap">
  <h1>GTMC Result System</h1>
  <p class="sub">Greater Tomorrow Model College</p>
  <div id="loginErr" class="error-box hidden"></div>
  <form id="loginForm">
    <div class="field">
      <label>Email</label>
      <input type="email" id="inEmail" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="inPassword" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn block" id="loginBtn">Sign In</button>
    <div style="text-align:center;margin-top:12px">
      <a href="#" onclick="event.preventDefault();showForgotPassword()" style="color:#1f4e79;font-size:13px;text-decoration:none">Forgot password?</a>
    </div>
  </form>
</div>

<!-- APP -->
<div id="view-app" class="app hidden">
  <div class="topbar no-print">
    <div>
      <div class="who" id="whoName">—</div>
      <div class="role" id="whoRole">—</div>
    </div>
    <div class="menu">
      <button onclick="toggleMenu(event)">Menu ▾</button>
      <div id="topMenu" class="dropdown hidden">
        <a onclick="goHome()">🏠 Home</a>
        <a onclick="changePassword()">🔒 Change Password</a>
        <a onclick="logout()">🚪 Logout</a>
      </div>
    </div>
  </div>
  <div class="tabs no-print" id="tabs"></div>
  <div id="pane"></div>
</div>

<div id="modalRoot"></div>

<script>
/* ============================================================
 * CONFIGURATION
 * ============================================================ */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzaUxqJaK0ybcNms2vvYVUXSNYEUAEGBhZ2AfA_PuGMrQ8_irkvbYY-m949b-KErRLWxw/exec';
const APPS_SCRIPT_SECRET = 'gtmc2026_secret_change_me_now_1234567890';

/* ============================================================
 * GLOBAL STATE
 * ============================================================ */
const S = {
  user: null,
  config: null,
  currentTab: null,
  entryState: null,
  bulkPending: null,
  traitsEntry: null,
  remarksEntry: null,
  currentReport: null,
  _confirmResolve: null,
  _promptResolve: null
};

/* ============================================================
 * LOW-LEVEL API
 * ============================================================ */
async function sheets(action, payload = {}) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, secret: APPS_SCRIPT_SECRET, ...payload }),
    redirect: 'follow'
  });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); }
  catch (e) { throw new Error('Bad response: ' + text.slice(0, 120)); }
  if (data.ok === false) throw new Error(data.error || 'Request failed');
  return data;
}

/* ============================================================
 * EXCEL/CSV PARSER
 * ============================================================ */
async function readSpreadsheetFile(file) {
  const name = (file.name || '').toLowerCase();
  const isExcel = name.endsWith('.xlsx') || name.endsWith('.xls');
  const isCsv = name.endsWith('.csv') || name.endsWith('.txt');
  if (isCsv) {
    const text = await file.text();
    const csvRows = parseCsvText(text);
    if (csvRows.length && looksLikeHeader(csvRows[0])) csvRows.shift();
    return csvRows;
  }
  if (isExcel) {
    if (!window.XLSX) await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
    const buf = await file.arrayBuffer();
    const wb = window.XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = window.XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false });
    if (rows.length && looksLikeHeader(rows[0])) rows.shift();
    return rows.map(r => r.map(c => c == null ? '' : String(c).trim()));
  }
  throw new Error('Unsupported file: ' + name);
}
function looksLikeHeader(row) {
  const h = row.map(c => String(c || '').toLowerCase().replace(/\s+/g, ''));
  return h.some(x => ['surname','firstname','name','studentid','classid','score','classname','subjectname','email','fullname','middlename','gender'].includes(x));
}
function parseCsvText(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  return lines.map(line => {
    const cells = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (c === ',' && !inQ) { cells.push(cur.trim()); cur = ''; continue; }
      cur += c;
    }
    cells.push(cur.trim());
    return cells;
  });
}
function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) return resolve();
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
}

/* ============================================================
 * SAMPLE IMPORT FILES
 * ============================================================ */
function getSampleData(kind) {
  const firstClass = (S.config && S.config.classes && S.config.classes[0] && S.config.classes[0].ClassName) || 'JSS1A';
  const secondClass = (S.config && S.config.classes && S.config.classes[1] && S.config.classes[1].ClassName) || firstClass;
  switch (kind) {
    case 'classes': return { file: 'sample_classes', rows: [
      ['ClassName','ClassLevel','ArmLetter','Capacity'],
      ['JSS1A','JSS1','A',40], ['JSS1B','JSS1','B',40],
      ['SS1A','SS1','A',35], ['SS1B','SS1','B',35]
    ]};
    case 'subjects': return { file: 'sample_subjects', rows: [
      ['SubjectName','SubjectCode','IsCore (Yes/No)'],
      ['Mathematics','MTH','Yes'], ['English Language','ENG','Yes'],
      ['Agricultural Science','AGR','No'], ['Civic Education','CVE','No']
    ]};
    case 'students': return { file: 'sample_students', rows: [
      ['Surname','FirstName','MiddleName','Gender','ClassName'],
      ['Adeyemi','Tunde','Samuel','M',firstClass],
      ['Okafor','Chioma','','F',firstClass],
      ['Balogun','Ayomide','Grace','F',secondClass]
    ]};
    case 'teachers': return { file: 'sample_teachers', rows: [
      ['FullName','Email','Phone','Password'],
      ['Mrs Folake Adeleke','folake@school.ng','08012345678','ChangeMe123'],
      ['Mr Emeka Nwosu','emeka@school.ng','08087654321','ChangeMe123']
    ]};
    case 'scores': {
      const st = (S.entryState && S.entryState.students) || [];
      const max = S.entryState && S.entryState.assessment ? Number(S.entryState.assessment.MaxScore) : '';
      const rows = [['StudentID','Score','StudentName (info only)']];
      if (st.length) st.forEach(s => rows.push([s.StudentID, '', s.FullName]));
      else rows.push(['GT001', '', 'Adeyemi Tunde Samuel'], ['GT002', '', 'Okafor Chioma']);
      return { file: 'sample_scores' + (max !== '' ? '_max' + max : ''), rows };
    }
  }
  throw new Error('Unknown sample: ' + kind);
}
async function downloadSample(kind, format = 'xlsx') {
  try {
    const { file, rows } = getSampleData(kind);
    if (format === 'xlsx') {
      try {
        if (!window.XLSX) await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
        const ws = window.XLSX.utils.aoa_to_sheet(rows);
        ws['!cols'] = rows[0].map((_, i) => ({ wch: Math.min(40, Math.max(...rows.map(r => String(r[i] ?? '').length)) + 4) }));
        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, 'Sample');
        window.XLSX.writeFile(wb, file + '.xlsx');
        toast('Sample downloaded — replace the example rows with your data', 'success');
        return;
      } catch (e) { /* fall through to CSV */ }
    }
    const csv = rows.map(r => r.map(x => `"${String(x ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = file + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Sample downloaded (CSV)', 'success');
  } catch (e) { toast('Could not create sample: ' + e.message, 'error'); }
}

function openFilePicker(accept, onFile) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = accept;
  inp.onchange = () => { if (inp.files[0]) onFile(inp.files[0]); };
  inp.click();
}
async function bulkSoftDelete(tab, matchCol, vals) {
  if (!vals.length) return { ok: true, affected: 0 };
  return sheets('bulkSoftDeleteRows', { tab, matchCol, matchVals: vals, userId: S.user.userId });
}

/* ============================================================
 * UTILITIES
 * ============================================================ */
const $  = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function toast(msg, kind = 'info') {
  $$('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
function openModal(html, opts = {}) {
  const cls = opts.large ? 'modal lg' : 'modal';
  $('#modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="${cls}">${html}</div></div>`;
}
function closeModal() { $('#modalRoot').innerHTML = ''; }
function confirmBox(msg) {
  return new Promise(resolve => {
    openModal(`<h3>Confirm</h3><p style="margin-bottom:20px">${esc(msg)}</p>
      <div class="actions">
        <button class="btn secondary" onclick="closeModal();_resolveConfirm(false)">Cancel</button>
        <button class="btn danger" onclick="closeModal();_resolveConfirm(true)">Confirm</button>
      </div>`);
    S._confirmResolve = resolve;
  });
}
function _resolveConfirm(v) { if (S._confirmResolve) S._confirmResolve(v); }
function promptBox(title, label, def = '') {
  return new Promise(resolve => {
    openModal(`<h3>${esc(title)}</h3>
      <div class="field"><label>${esc(label)}</label><input id="promptInput" value="${esc(def)}"></div>
      <div class="actions">
        <button class="btn secondary" onclick="closeModal();_resolvePrompt(null)">Cancel</button>
        <button class="btn" onclick="closeModal();_resolvePrompt(document.getElementById('promptInput').value)">OK</button>
      </div>`);
    S._promptResolve = resolve;
    setTimeout(() => { const i = $('#promptInput'); if (i) { i.focus(); i.select(); } }, 50);
  });
}
function _resolvePrompt(v) { if (S._promptResolve) S._promptResolve(v); }
function nextId(prefix, existing, pad = 4) {
  let max = 0;
  (existing || []).forEach(v => {
    const s = String(v || '');
    if (!s.startsWith(prefix)) return;
    const n = parseInt(s.slice(prefix.length), 10);
    if (!isNaN(n) && n > max) max = n;
  });
  return prefix + String(max + 1).padStart(pad, '0');
}
function nowISO() { return new Date().toISOString(); }
function fmtDateTime(d) {
  if (!d) return '';
  try {
    const x = new Date(d);
    if (isNaN(x)) return String(d);
    return x.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch { return String(d); }
}
function showLoading(elId, msg = 'Loading…') {
  const el = document.getElementById(elId);
  if (el) el.innerHTML = `<div class="spinner-center"><span class="loading"></span><div class="meta" style="margin-top:10px">${esc(msg)}</div></div>`;
}
function showError(elId, err) {
  const el = document.getElementById(elId);
  if (el) el.innerHTML = `<div class="error-box">${esc(err.message || String(err))}</div>`;
}

 * ============================================================ */
function loadTemplateSettings(schoolInfoRows) {
  const defaults = {
    showLogo: true, showAddress: true, showMotto: true, showPhone: false, showEmail: false,
    showStudentID: true, showPosition: true, showAttendance: true, showNumInClass: true,
    colTest1: true, colTest2: true, colTest3: true, colExam: true,
    colTermTotal: true, colCumAvg: true, colClassAvg: true,
    colGrade: true, colRank: true, colRemark: true,
    showTraits: true, showSkills: true, showRemarks: true,
    showSignature: true, showScale: true,
    colorHeaderBg:    '#1f4e79',
    colorHeaderText:  '#ffffff',
    colorTableHeadBg: '#1f4e79',
    colorTableHeadTxt:'#ffffff',
    colorPassRowBg:   '#ffffff',
    colorFailRowBg:   '#fee',
    colorFailText:    '#991b1b',
    colorBodyText:    '#1a1a2e'
  };
  const map = {};
  schoolInfoRows.forEach(r => { map[r.FieldKey] = r.FieldValue; });
  const out = { ...defaults };
  Object.keys(defaults).forEach(k => {
    const key = 'Template' + k.charAt(0).toUpperCase() + k.slice(1);
    const colorKey = k.startsWith('color') ? 'Color' + k.slice(5) : null;
    const stored = map[key] || (colorKey && map[colorKey]);
    if (stored !== undefined && stored !== '') {
      if (typeof defaults[k] === 'boolean') out[k] = String(stored).toUpperCase() === 'TRUE';
      else out[k] = stored;
    }
  });
  return out;
}
async function saveTemplateSettings(settings) {
  const all = await sheets('readTab', { tab: 'SchoolInfo' });
  for (const k in settings) {
    const key = 'Template' + k.charAt(0).toUpperCase() + k.slice(1);
    const exists = all.rows.find(r => r.FieldKey === key);
    const value = typeof settings[k] === 'boolean' ? (settings[k] ? 'TRUE' : 'FALSE') : settings[k];
    if (exists) {
      await sheets('updateRow', { tab: 'SchoolInfo', matchCol: 'FieldKey', matchVal: key, patch: { FieldValue: value, UpdatedAt: nowISO() } });
    } else {
      await sheets('appendRow', { tab: 'SchoolInfo', row: { FieldKey: key, FieldValue: value, UpdatedAt: nowISO() } });
    }
  }
  await refreshTab('SchoolInfo', 'schoolInfo');
  S.config.template = loadTemplateSettings(S.config.schoolInfo);
}

function addSession() {

  openModal(`

async function saveSession() {
  try {
    const name = $('#sesName').value.trim();
    const start = $('#sesStart').value;
    const end = $('#sesEnd').value;
    if (!name || !start || !end) throw new Error('All fields required');
    const all = await sheets('readTab', { tab: 'Sessions' });
    const id = nextId('S', all.rows.map(r => r.SessionID), 4);
    await sheets('appendRow', { tab: 'Sessions', row: {
      SessionID: id, SessionName: name, StartDate: start, EndDate: end,
      IsActive: all.rows.length === 0, IsArchived: false, ArchivedAt: '',
      CreatedAt: nowISO(), CreatedBy: S.user.userId
    }});
    const tAll = await sheets('readTab', { tab: 'Terms' });
    let nextTerm = tAll.rows.length + 1;
    const termDefs = [{ name: 'First Term', s: 0, e: 3 }, { name: 'Second Term', s: 4, e: 7 }, { name: 'Third Term', s: 8, e: 11 }];
    const base = new Date(start);
    for (let i = 0; i < termDefs.length; i++) {
      const sd = new Date(base); sd.setMonth(sd.getMonth() + termDefs[i].s);
      const ed = new Date(base); ed.setMonth(ed.getMonth() + termDefs[i].e);
      const tid = 'T' + String(nextTerm++).padStart(4, '0');
      await sheets('appendRow', { tab: 'Terms', row: {
        TermID: tid, SessionID: id, TermNumber: i + 1, TermName: termDefs[i].name,
        StartDate: sd.toISOString().slice(0, 10), EndDate: ed.toISOString().slice(0, 10),
        VacationDate: '', ResumptionDate: '',
        IsCurrent: i === 0, IsClosed: false, ClosedAt: ''
      }});
    }
    if (all.rows.length === 0) {
      await sheets('updateRow', { tab: 'SystemConfig', matchCol: 'ConfigKey', matchVal: 'ActiveSessionID', patch: { ConfigValue: id } });
    }
    closeModal();
    toast('Session created', 'success');
    await refreshTab('Sessions', 'sessions');
    await refreshTab('Terms', 'terms');
    S.config.sys = (await sheets('getSystemConfig')).data;
    navigate('sessions');
  } catch (err) { toast(err.message, 'error'); }
}

async function processAutoGenerate() {
  const scope = $('#genScope').value;
  const session = activeSession();
  const term = currentTerm();
  const classes = scope === 'one' ? [$('#genClass').value] : S.config.classes.filter(c => String(c.IsActive).toUpperCase() !== 'FALSE').map(c => c.ClassID);
  const standard = [{ name: 'Test 1', max: 10, w: 10, o: 1 }, { name: 'Test 2', max: 10, w: 10, o: 2 }, { name: 'Test 3', max: 10, w: 10, o: 3 }, { name: 'Exam', max: 70, w: 70, o: 4 }];
  const all = await sheets('readTab', { tab: 'Assessments' });
  let next = all.rows.length + 1, created = 0, skipped = 0;
  for (const classId of classes) {
    const links = S.config.classSubjects.filter(cs => cs.ClassID === classId && String(cs.IsActive).toUpperCase() !== 'FALSE');
    const subjectIds = links.length ? links.map(l => l.SubjectID) : S.config.subjects.filter(s => String(s.IsActive).toUpperCase() !== 'FALSE').map(s => s.SubjectID);
    for (const subjectId of subjectIds) {
      for (const s of standard) {
        if (all.rows.find(r => r.ClassID === classId && r.SubjectID === subjectId && r.SessionID === session.SessionID && r.TermID === term.TermID && r.AssessmentName === s.name)) { skipped++; continue; }
        const id = 'A' + String(next++).padStart(4, '0');
        await sheets('appendRow', { tab: 'Assessments', row: {
          AssessmentID: id, SessionID: session.SessionID, TermID: term.TermID,
          ClassID: classId, SubjectID: subjectId, AssessmentName: s.name,
          MaxScore: s.max, WeightPercent: s.w, DisplayOrder: s.o, IsActive: true
        }});
        created++;
      }
    }
  }
  closeModal();
  toast(`Created ${created}, skipped ${skipped}`, 'success');
  await refreshTab('Assessments', 'assessments');
  navigate('assessments');
}

async function processStudentImport(rows, sessionId) {
  const errors = [];
  const all = await sheets('readTab', { tab: 'Students' });
  let next = all.rows.length + 1, imported = 0;
  const firstRow = rows[0] || [];
  const header = firstRow.map(x => String(x || '').toLowerCase().replace(/\s+/g, ''));
  const idx = {
    surname: header.indexOf('surname'),
    firstName: header.indexOf('firstname') >= 0 ? header.indexOf('firstname') : header.indexOf('first'),
    middleName: header.indexOf('middlename') >= 0 ? header.indexOf('middlename') : header.indexOf('middle'),
    gender: header.indexOf('gender'),
    className: header.indexOf('classname') >= 0 ? header.indexOf('classname') : header.indexOf('class'),
    fullName: header.indexOf('fullname') >= 0 ? header.indexOf('fullname') : header.indexOf('name')
  };
  const hasHeader = idx.surname >= 0 || idx.fullName >= 0;
  const dataRows = hasHeader ? rows.slice(1) : rows;
  for (let i = 0; i < dataRows.length; i++) {
    const row = dataRows[i];
    try {
      let sur = '', first = '', mid = '', gen = 'M', cls = '';
      if (hasHeader) {
        sur = idx.surname >= 0 ? String(row[idx.surname] || '').trim() : '';
        first = idx.firstName >= 0 ? String(row[idx.firstName] || '').trim() : '';
        mid = idx.middleName >= 0 ? String(row[idx.middleName] || '').trim() : '';
        gen = idx.gender >= 0 ? String(row[idx.gender] || '').trim() : 'M';
        cls = idx.className >= 0 ? String(row[idx.className] || '').trim() : '';
        if (!sur && idx.fullName >= 0) {
          const parts = String(row[idx.fullName] || '').trim().split(/\s+/);
          sur = parts[0] || ''; first = parts[1] || ''; mid = parts.slice(2).join(' ');
        }
      } else {
        sur = String(row[0] || '').trim();
        first = String(row[1] || '').trim();
        mid = String(row[2] || '').trim();
        gen = String(row[3] || 'M').trim();
        cls = String(row[4] || '').trim();
      }
      if (!sur || !first) { errors.push(`Row ${i+1}: missing name`); continue; }
      if (!cls) { errors.push(`Row ${i+1}: missing class`); continue; }
      const c = S.config.classes.find(x => x.ClassName.toLowerCase() === cls.toLowerCase());
      if (!c) { errors.push(`Row ${i+1}: unknown class "${cls}"`); continue; }
      const id = 'GT' + String(next++).padStart(3, '0');
      const full = [sur, first, mid].filter(Boolean).join(' ');
      await sheets('appendRow', { tab: 'Students', row: {
        StudentID: id, SessionID: sessionId,
        Surname: sur, FirstName: first, MiddleName: mid, FullName: full,
        Gender: gen || 'M', ClassID: c.ClassID,
        FeeStatus: '', FeeUpdatedAt: '', FeeUpdatedBy: '',
        IsActive: true, CreatedAt: nowISO()
      }});
      imported++;
    } catch (e) { errors.push(`Row ${i+1}: ${e.message}`); }
  }
  return { ok: imported, errors };
}

async function resolvePasswordRequest(reqId) {
  const data = await sheets('readTab', { tab: 'PasswordRequests' });
  const req = data.rows.find(r => r.RequestID === reqId);
  if (!req) return toast('Not found', 'error');
  const suggested = 'GT' + Math.floor(100000 + Math.random() * 900000);
  openModal(`
    <h3>🔑 Send New Password</h3>
    <p class="meta" style="margin-bottom:12px">
      Request from <strong>${esc(req.Email)}</strong> (User: ${esc(req.UserID)})<br>
      Requested: ${fmtDateTime(req.RequestedAt)}
    </p>
    <div class="field"><label>New Password</label>
      <input id="newPassVal" value="${suggested}" style="font-family:monospace;font-size:16px"></div>
    <div class="info-box"><strong>Copy this password and send it to the user</strong> via WhatsApp or SMS.</div>
    <div class="actions">
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="copyPasswordToClipboard()">📋 Copy</button>
      <button class="btn success" onclick="confirmResolvePassword('${reqId}')">✓ Set Password</button>
    </div>`);
}
function copyPasswordToClipboard() {
  const v = document.getElementById('newPassVal').value;
  navigator.clipboard.writeText(v).then(() => toast('Copied', 'success'));
}
async function confirmResolvePassword(reqId) {
  const newPass = document.getElementById('newPassVal').value.trim();
  if (!newPass) return toast('Password required', 'error');
  try {
    const data = await sheets('readTab', { tab: 'PasswordRequests' });
    const req = data.rows.find(r => r.RequestID === reqId);
    if (!req) throw new Error('Request not found');
    await sheets('updateRow', { tab: 'Users', matchCol: 'UserID', matchVal: req.UserID, patch: { PasswordHash: newPass } });
    await sheets('updateRow', { tab: 'PasswordRequests', matchCol: 'RequestID', matchVal: reqId, patch: {
      Status: 'Resolved', NewPassword: newPass,
      ResolvedAt: nowISO(), ResolvedBy: S.user.userId
    }});
    closeModal();
    openModal(`<h3>✅ Password Reset</h3>
      <p>New password for <strong>${esc(req.Email)}</strong>:</p>
      <div style="background:#f3f4f6;padding:14px;border-radius:8px;margin:12px 0;font-family:monospace;font-size:20px;text-align:center;font-weight:700">${esc(newPass)}</div>
      <p class="meta">Send this to the user.</p>
      <div class="actions"><button class="btn" onclick="closeModal();navigate('passwordRequests')">OK</button></div>`);
  } catch (err) { toast(err.message, 'error'); }
}

async function renderReview() {
  const subs = await sheets('readTab', { tab: 'Submissions' });
  const pending = subs.rows.filter(s => s.Status === 'Pending');
  if (!pending.length) {
    $('#pane').innerHTML = `<div class="card"><h2>Pending Submissions</h2><p class="meta">No pending submissions ✅</p></div>`;
    return;
  }
  const enriched = await Promise.all(pending.map(async (sub) => {
    const [ssR, userR] = await Promise.all([
      sheets('queryTab', { tab: 'ScoreSheets', where: { ScoreSheetID: sub.ScoreSheetID } }),
      sheets('queryTab', { tab: 'Users', where: { UserID: sub.TeacherID } })
    ]);
    return { sub, sheet: ssR.rows[0] || {}, teacher: userR.rows[0] || {} };
  }));
  $('#pane').innerHTML = `
    <div class="card">
      <h2>Pending Submissions (${enriched.length})</h2>
      ${enriched.map(({ sub, sheet, teacher }) => {
        const cls = classById(sheet.ClassID);
        const subj = subjectById(sheet.SubjectID);
        const a = assessmentById(sheet.AssessmentID);
        return `
          <div class="sub-item">
            <div class="line1">
              <div class="title">${esc(subj ? subj.SubjectName : sheet.SubjectID)} · ${esc(cls ? cls.ClassName : sheet.ClassID)}</div>
              <span class="badge pending">Pending</span>
            </div>
            <div class="meta">${esc(a ? a.AssessmentName : sheet.AssessmentID)} · ${esc(teacher.FullName || sub.TeacherID)} · ${sub.ScoresCount}/${sheet.TotalStudents} · ${fmtDateTime(sub.SubmittedAt)}</div>
            <div class="actions">
              <button class="btn small success" onclick="approveSubmission('${sub.SubmissionID}','${sub.ScoreSheetID}')">✓ Approve</button>
              <button class="btn small danger" onclick="returnSubmission('${sub.SubmissionID}','${sub.ScoreSheetID}')">↩ Return</button>
              <button class="btn small secondary" onclick="viewSubmission('${sub.ScoreSheetID}')">View</button>
            </div>
          </div>`;
      }).join('')}
    </div>`;
}
async function approveSubmission(subId, sheetId) {
  if (!await confirmBox('Approve?')) return;
  const all = await sheets('readTab', { tab: 'Reviews' });
  const id = nextId('RV', all.rows.map(r => r.ReviewID), 4);
  await sheets('appendRow', { tab: 'Reviews', row: { ReviewID: id, SubmissionID: subId, AdminID: S.user.userId, Action: 'Approve', Comment: '', ReviewedAt: nowISO() }});
  await sheets('updateRow', { tab: 'Submissions', matchCol: 'SubmissionID', matchVal: subId, patch: { Status: 'Approved' } });
  await sheets('updateRow', { tab: 'ScoreSheets', matchCol: 'ScoreSheetID', matchVal: sheetId, patch: { Status: 'Approved', LastModifiedAt: nowISO() } });
  toast('Approved', 'success');
  navigate('review');
}
async function returnSubmission(subId, sheetId) {
  const comment = await promptBox('Return Submission', 'Reason:', '');
  if (!comment) return;
  const all = await sheets('readTab', { tab: 'Reviews' });
  const id = nextId('RV', all.rows.map(r => r.ReviewID), 4);
  await sheets('appendRow', { tab: 'Reviews', row: { ReviewID: id, SubmissionID: subId, AdminID: S.user.userId, Action: 'Return', Comment: comment, ReviewedAt: nowISO() }});
  await sheets('updateRow', { tab: 'Submissions', matchCol: 'SubmissionID', matchVal: subId, patch: { Status: 'Returned', Comment: comment } });
  await sheets('updateRow', { tab: 'ScoreSheets', matchCol: 'ScoreSheetID', matchVal: sheetId, patch: { Status: 'Returned' } });
  toast('Returned', 'success');
  navigate('review');
}
async function viewSubmission(sheetId) {
  const scores = (await sheets('queryTab', { tab: 'Scores', where: { ScoreSheetID: sheetId } })).rows.filter(r => String(r.IsDeleted).toUpperCase() !== 'TRUE');
  const ssR = (await sheets('queryTab', { tab: 'ScoreSheets', where: { ScoreSheetID: sheetId } })).rows[0];

      <thead><tr><th>#</th><th>Student</th><th>Score</th></tr></thead>

async function calculateTerm() {
  if (!await confirmBox('Run calculation for this term?')) return;
  toast('Calculating… please wait', 'info');
  try {
    const session = activeSession();
    const term = currentTerm();
    const [scoresR, sheetsR, assessmentsR, gradeBandsR] = await Promise.all([
      sheets('readTab', { tab: 'Scores' }),
      sheets('readTab', { tab: 'ScoreSheets' }),
      sheets('readTab', { tab: 'Assessments' }),
      sheets('readTab', { tab: 'GradeBands' })
    ]);
    const approvedSheets = sheetsR.rows.filter(s => String(s.SessionID) === String(session.SessionID) && String(s.TermID) === String(term.TermID) && s.Status === 'Approved');
    if (!approvedSheets.length) return toast('No approved scoresheets', 'warn');
    const approvedIds = new Set(approvedSheets.map(s => s.ScoreSheetID));
    const bySS = {};
    scoresR.rows.forEach(sc => {
      if (String(sc.IsDeleted).toUpperCase() === 'TRUE') return;
      if (!approvedIds.has(sc.ScoreSheetID)) return;
      const key = sc.StudentID + '|' + sc.SubjectID;
      if (!bySS[key]) bySS[key] = { scores: {}, classId: sc.ClassID };
      bySS[key].scores[sc.AssessmentID] = Number(sc.Score);
    });
    const aByCS = {};
    assessmentsR.rows.forEach(a => {
      if (String(a.SessionID) !== String(session.SessionID)) return;
      if (String(a.TermID) !== String(term.TermID)) return;
      if (String(a.IsActive).toUpperCase() === 'FALSE') return;
      const k = a.ClassID + '|' + a.SubjectID;
      if (!aByCS[k]) aByCS[k] = [];
      aByCS[k].push(a);
    });
    const termTotals = [], results = [];
    const now = nowISO();
    const existingTT = (await sheets('readTab', { tab: 'TermTotals' })).rows;
    const existingRes = (await sheets('readTab', { tab: 'Results' })).rows;
    let ttN = existingTT.length + 1, resN = existingRes.length + 1;
    for (const key in bySS) {
      const [studentId, subjectId] = key.split('|');
      const data = bySS[key];
      const list = aByCS[data.classId + '|' + subjectId] || [];
      const map = {};
      list.forEach(a => { map[a.AssessmentName] = data.scores[a.AssessmentID] || 0; });
      const t1 = map['Test 1'] || 0, t2 = map['Test 2'] || 0, t3 = map['Test 3'] || 0, exam = map['Exam'] || 0;
      const total = t1 + t2 + t3 + exam;
      const gb = gradeBandsR.rows.find(b => total >= Number(b.MinScore) && total <= Number(b.MaxScore));
      termTotals.push({ TermTotalID: 'TT' + String(ttN++).padStart(7, '0'), SessionID: session.SessionID, TermID: term.TermID, StudentID: studentId, ClassID: data.classId, SubjectID: subjectId, Test1: t1, Test2: t2, Test3: t3, Exam: exam, TermTotal: total, CalculatedAt: now, IsLocked: true, Version: 1 });
      results.push({ ResultID: 'R' + String(resN++).padStart(7, '0'), SessionID: session.SessionID, TermID: term.TermID, StudentID: studentId, ClassID: data.classId, SubjectID: subjectId, Test1: t1, Test2: t2, Test3: t3, Exam: exam, Term1Total: term.TermNumber === 1 ? total : '', Term2Total: term.TermNumber === 2 ? total : '', Term3Total: term.TermNumber === 3 ? total : '', CumulativeAverage: total, Grade: gb ? gb.Grade : '', Remark: gb ? gb.Remark : '', SubjectRank: '', ClassAverage: '', ColorCode: gb ? gb.ColorCode : '', CalculatedAt: now });
    }
    for (const r of termTotals) await sheets('appendRow', { tab: 'TermTotals', row: r });
    for (const r of results) await sheets('appendRow', { tab: 'Results', row: r });
    const savedResults = (await sheets('readTab', { tab: 'Results' })).rows.filter(r => String(r.SessionID) === String(session.SessionID) && String(r.TermID) === String(term.TermID));
    const byCS = {};
    savedResults.forEach(r => {
      const k = r.ClassID + '|' + r.SubjectID;
      if (!byCS[k]) byCS[k] = [];
      byCS[k].push(r);
    });
    for (const k in byCS) {
      const rows = byCS[k].slice().sort((a, b) => Number(b.CumulativeAverage) - Number(a.CumulativeAverage));
      const sum = rows.reduce((s, r) => s + Number(r.CumulativeAverage), 0);
      const avg = rows.length ? Math.round((sum / rows.length) * 100) / 100 : 0;
      let rank = 1, last = null;
      rows.forEach((r, i) => {
        const v = Number(r.CumulativeAverage);
        if (v !== last) rank = i + 1;
        last = v;
        r._rank = rank; r._avg = avg;
      });
      for (const r of rows) {
        await sheets('updateRow', { tab: 'Results', matchCol: 'ResultID', matchVal: r.ResultID, patch: { SubjectRank: r._rank, ClassAverage: r._avg } });
      }
    }
    const byStudent = {};
    savedResults.forEach(r => {
      if (!byStudent[r.StudentID]) byStudent[r.StudentID] = { sid: r.StudentID, cid: r.ClassID, total: 0, n: 0 };
      byStudent[r.StudentID].total += Number(r.CumulativeAverage);
      byStudent[r.StudentID].n++;
    });
    const byClass = {};
    Object.values(byStudent).forEach(s => {
      if (!byClass[s.cid]) byClass[s.cid] = [];
      byClass[s.cid].push(s);
    });
    for (const cid in byClass) {
      const rows = byClass[cid];
      rows.forEach(r => { r.avg = r.n ? Math.round((r.total / r.n) * 100) / 100 : 0; });
      rows.sort((a, b) => b.avg - a.avg);
      let rank = 1, last = null;
      rows.forEach((r, i) => {
        if (r.avg !== last) rank = i + 1;
        last = r.avg;
        r.rank = rank;
      });
      const size = rows.length;
      for (const r of rows) {
        await sheets('appendRow', { tab: 'OverallPositions', row: {
          OverallID: 'OP' + String(Date.now() + Math.floor(Math.random() * 1000)).slice(-8),
          SessionID: session.SessionID, TermID: term.TermID,
          StudentID: r.sid, ClassID: cid,
          CumulativeTotal: r.total, SubjectsCount: r.n,
          OverallAverage: r.avg, OverallRank: r.rank,
          ClassSize: size, CalculatedAt: nowISO()
        }});
      }
    }
    toast(`Calculated ${results.length} results`, 'success');
    navigate('broadsheet');
  } catch (err) { toast('Error: ' + err.message, 'error'); }
}
async function exportBroadsheetCSV() {
  const session = activeSession();
  const term = currentTerm();
  const rows = (await sheets('readTab', { tab: 'Results' })).rows.filter(r => String(r.SessionID) === String(session.SessionID) && String(r.TermID) === String(term.TermID));
  if (!rows.length) return toast('No results', 'warn');
  const lines = [['StudentID','ClassID','SubjectID','T1','T2','T3','Exam','Total','Cum','Grade','Remark','Rank','ClassAvg']];
  rows.forEach(r => {
    const total = r.Term1Total || r.Term2Total || r.Term3Total || '';
    lines.push([r.StudentID, r.ClassID, r.SubjectID, r.Test1, r.Test2, r.Test3, r.Exam, total, r.CumulativeAverage, r.Grade, r.Remark, r.SubjectRank, r.ClassAverage]);
  });
  const csv = lines.map(r => r.map(x => `"${String(x ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `broadsheet-${session.SessionName}-${term.TermName}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function publishClass() {
  openModal(`
    <h3>Publish a Class</h3>
    <div class="field"><label>Class</label><select id="pubClass">${classOptions()}</select></div>
    <div class="info-box">Students with Fee Status "Owing" are withheld automatically.</div>
    <div class="actions">
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
      <button class="btn success" onclick="processPublish()">Publish</button>
    </div>`);
}
async function processPublish() {
  const session = activeSession();
  const term = currentTerm();
  const classId = $('#pubClass').value;
  const students = (await sheets('queryTab', { tab: 'Students', where: { SessionID: session.SessionID, ClassID: classId } })).rows.filter(s => String(s.IsActive).toUpperCase() !== 'FALSE');
  const all = await sheets('readTab', { tab: 'Publications' });
  let next = all.rows.length + 1, shown = 0, withheld = 0;
  for (const st of students) {
    const debtor = st.FeeStatus && st.FeeStatus !== 'Cleared';
    const id = 'PUB' + String(next++).padStart(4, '0');
    await sheets('appendRow', { tab: 'Publications', row: {
      PublicationID: id, SessionID: session.SessionID, TermID: term.TermID,
      ClassID: classId, StudentID: st.StudentID,
      IsVisible: !debtor, BlockReason: debtor ? 'Outstanding fees' : '',
      PublishedBy: S.user.userId, PublishedAt: nowISO(), Version: 1
    }});
    if (debtor) withheld++; else shown++;
  }
  closeModal();
  toast(`Published: ${shown} visible, ${withheld} withheld`, 'success');
  navigate('publish');
}
function unpublishClass() {
  openModal(`
    <h3>Unpublish a Class</h3>
    <div class="field"><label>Class</label><select id="unpubClass">${classOptions()}</select></div>
    <div class="warn-box">All students in this class will lose access.</div>
    <div class="actions">
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
      <button class="btn danger" onclick="processUnpublish()">Unpublish</button>
    </div>`);
}
async function processUnpublish() {
  const session = activeSession();
  const term = currentTerm();
  const classId = $('#unpubClass').value;
  const pubs = (await sheets('readTab', { tab: 'Publications' })).rows.filter(p => String(p.SessionID) === String(session.SessionID) && String(p.TermID) === String(term.TermID) && String(p.ClassID) === String(classId));
  for (const p of pubs) {
    await sheets('updateRow', { tab: 'Publications', matchCol: 'PublicationID', matchVal: p.PublicationID, patch: { IsVisible: false } });
  }
  closeModal();
  toast(`Unpublished ${pubs.length}`, 'success');
  navigate('publish');
}

async function archiveSession() {
  if (!await confirmBox('Archive the current session?')) return;
  toast('Archiving…', 'info');
  try {
    const r = await sheets('archiveCurrentSession', {});
    openModal(`<h3>✅ Archive Complete</h3>
      <p>Archived as: <code>${esc(r.archivedName)}</code></p>
      <p>Archive ID: <code>${esc(r.archivedSpreadsheetId)}</code></p>

const saveTimers = {};
function onScoreInput(e) {
  const inp = e.target;
  const sid = inp.dataset.student;
  const max = Number(S.entryState.assessment.MaxScore);
  const v = inp.value === '' ? null : Number(inp.value);
  if (v !== null && (isNaN(v) || v < 0 || v > max)) {
    inp.classList.add('error'); inp.classList.remove('saved');
    setStatus(sid, 'error', 'Max ' + max);
    return;
  }
  inp.classList.remove('error');
  clearTimeout(saveTimers[sid]);
  setStatus(sid, 'pending', 'Saving…');
  saveTimers[sid] = setTimeout(() => saveScore(sid, v, inp), 400);
}
function onScoreKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const all = Array.from(document.querySelectorAll('.score-input'));
    const idx = all.indexOf(e.target);
    if (all[idx + 1]) all[idx + 1].focus();
  }
}
async function saveScore(studentId, val, inp) {
  if (val === null) return;
  try {
    const { scoreSheetId, assessment } = S.entryState;
    const existing = (await sheets('queryTab', { tab: 'Scores', where: { ScoreSheetID: scoreSheetId, StudentID: studentId, AssessmentID: assessment.AssessmentID } })).rows[0];
    const ss = (await sheets('queryTab', { tab: 'ScoreSheets', where: { ScoreSheetID: scoreSheetId } })).rows[0];
    if (existing && String(existing.IsDeleted).toUpperCase() !== 'TRUE') {
      await sheets('updateRow', { tab: 'Scores', matchCol: 'ScoreID', matchVal: existing.ScoreID, patch: { Score: val, MaxScore: Number(assessment.MaxScore), IsValid: true, UpdatedAt: nowISO(), Version: Number(existing.Version || 1) + 1 } });
    } else {
      const allS = await sheets('readTab', { tab: 'Scores' });
      const id = nextId('SC', allS.rows.map(r => r.ScoreID), 6);
      await sheets('appendRow', { tab: 'Scores', row: {
        ScoreID: id, ScoreSheetID: scoreSheetId, SessionID: ss.SessionID, TermID: ss.TermID,
        ClassID: ss.ClassID, SubjectID: ss.SubjectID, AssessmentID: assessment.AssessmentID, StudentID: studentId,
        Score: val, MaxScore: Number(assessment.MaxScore), IsValid: true,
        EnteredBy: S.user.userId, EnteredAt: nowISO(), UpdatedAt: nowISO(),
        Version: 1, IsDeleted: false
      }});
    }
    S.entryState.scores[studentId] = val;
    if (inp) inp.classList.add('saved');
    setStatus(studentId, 'saved', '✓ Saved');
    updateProgress();
    const count = Object.keys(S.entryState.scores).length;
    await sheets('updateRow', { tab: 'ScoreSheets', matchCol: 'ScoreSheetID', matchVal: scoreSheetId, patch: { ScoresEntered: count, LastModifiedAt: nowISO() } });
  } catch (err) { setStatus(studentId, 'error', err.message); }
}

  if (!el) return;
  el.className = 'status ' + kind;
  el.textContent = text;
}
function updateProgress() {

  const total = S.entryState.students.length;
  const pct = total ? Math.round((entered / total) * 100) : 0;

function importScoresFromFile() {
  if (!S.entryState) return;
  openFilePicker('.xlsx,.xls,.csv,.txt', async (file) => {
    try {
      toast('Reading…', 'info');
      const rows = await readSpreadsheetFile(file);
      const { assessment, students } = S.entryState;
      const max = Number(assessment.MaxScore);
      const firstRow = rows[0] || [];
      const header = firstRow.map(x => String(x || '').toLowerCase().replace(/\s+/g, ''));
      const idIdx = header.indexOf('studentid');
      const scoreIdx = header.indexOf('score');
      const nameIdx = header.indexOf('studentname') >= 0 ? header.indexOf('studentname') : header.indexOf('name');
      const hasHeader = idIdx >= 0 || scoreIdx >= 0 || nameIdx >= 0;
      const studentMap = {};
      students.forEach(s => { studentMap[s.StudentID.toLowerCase()] = s; studentMap[s.FullName.toLowerCase()] = s; });
      const dataRows = hasHeader ? rows.slice(1) : rows;
      const parsed = [], errors = [];
      const seen = new Set();
      dataRows.forEach((row, i) => {
        try {
          let sid = '', sc = '';
          if (hasHeader) {
            sid = idIdx >= 0 ? String(row[idIdx] || '').trim() : '';
            sc = scoreIdx >= 0 ? String(row[scoreIdx] || '').trim() : '';
            if (!sid && nameIdx >= 0) {
              const nm = String(row[nameIdx] || '').trim().toLowerCase();
              const found = studentMap[nm];
              if (found) sid = found.StudentID;
            }
          } else {
            sid = String(row[0] || '').trim();
            sc = String(row[1] || '').trim();
          }
          if (!sid) { errors.push(`Row ${i+1}: no student id/name`); return; }
          const st = studentMap[sid.toLowerCase()];
          if (!st) { errors.push(`Row ${i+1}: unknown "${sid}"`); return; }
          if (seen.has(st.StudentID)) { errors.push(`Row ${i+1}: dup ${st.StudentID}`); return; }
          if (sc === '') return; // blank cell = not scored yet
          const num = Number(sc);
          if (isNaN(num) || num < 0 || num > max) { errors.push(`Row ${i+1}: invalid "${sc}" (0–${max})`); return; }
          seen.add(st.StudentID);
          parsed.push({ studentId: st.StudentID, studentName: st.FullName, score: num });
        } catch (e) { errors.push(`Row ${i+1}: ${e.message}`); }
      });
      openModal(`
        <h3>Import Scores — ${parsed.length} valid</h3>
        ${errors.length ? `<div class="warn-box"><pre style="white-space:pre-wrap;font-size:12px;max-height:150px;overflow:auto">${esc(errors.join('\n'))}</pre></div>` : ''}
        <div class="tbl-wrap" style="max-height:300px;overflow-y:auto"><table class="tbl">
          <thead><tr><th>Student</th><th>Score</th></tr></thead>
          <tbody>${parsed.map(p => `<tr><td>${esc(p.studentName)} (${esc(p.studentId)})</td><td><strong>${p.score}</strong></td></tr>`).join('')}</tbody>
        </table></div>
        <div class="actions">
          <button class="btn secondary" onclick="closeModal()">Cancel</button>
          ${parsed.length ? `<button class="btn success" onclick='applyImportedScores(${JSON.stringify(JSON.stringify(parsed))})'>Apply ${parsed.length} Scores</button>` : ''}
        </div>`, { large: true });
    } catch (err) { toast('Import error: ' + err.message, 'error'); }
  });
}
async function applyImportedScores(parsedJson) {
  try {
    const parsed = JSON.parse(parsedJson);
    const { scoreSheetId, assessment } = S.entryState;
    const ss = (await sheets('queryTab', { tab: 'ScoreSheets', where: { ScoreSheetID: scoreSheetId } })).rows[0];
    const existing = (await sheets('queryTab', { tab: 'Scores', where: { ScoreSheetID: scoreSheetId } })).rows;
    const map = {};
    existing.forEach(r => { map[r.StudentID + '|' + r.AssessmentID] = r; });
    const allS = await sheets('readTab', { tab: 'Scores' });
    let next = allS.rows.length + 1, created = 0, updated = 0;
    closeModal();
    toast('Applying…', 'info');
    for (const p of parsed) {
      const key = p.studentId + '|' + assessment.AssessmentID;
      const row = map[key];
      if (row && String(row.IsDeleted).toUpperCase() !== 'TRUE') {
        await sheets('updateRow', { tab: 'Scores', matchCol: 'ScoreID', matchVal: row.ScoreID, patch: { Score: p.score, MaxScore: Number(assessment.MaxScore), IsValid: true, UpdatedAt: nowISO(), Version: Number(row.Version || 1) + 1 } });
        updated++;
      } else {
        const id = 'SC' + String(next++).padStart(6, '0');
        await sheets('appendRow', { tab: 'Scores', row: {
          ScoreID: id, ScoreSheetID: scoreSheetId, SessionID: ss.SessionID, TermID: ss.TermID,
          ClassID: ss.ClassID, SubjectID: ss.SubjectID, AssessmentID: assessment.AssessmentID, StudentID: p.studentId,
          Score: p.score, MaxScore: Number(assessment.MaxScore), IsValid: true,
          EnteredBy: S.user.userId, EnteredAt: nowISO(), UpdatedAt: nowISO(),
          Version: 1, IsDeleted: false
        }});
        created++;
      }
      S.entryState.scores[p.studentId] = p.score;
    }
    await sheets('updateRow', { tab: 'ScoreSheets', matchCol: 'ScoreSheetID', matchVal: scoreSheetId, patch: { ScoresEntered: created + updated, LastModifiedAt: nowISO() } });
    toast(`✅ Imported ${created + updated} scores`, 'success');
    renderEntryArea();
  } catch (err) { toast(err.message, 'error'); }
}
async function submitScoreSheet() {
  if (!S.entryState) return;
  const { scoreSheetId, students, scores } = S.entryState;
  const entered = Object.keys(scores).length;
  if (entered < students.length) {
    if (!await confirmBox(`${students.length - entered} missing. Submit anyway?`)) return;
  } else {
    if (!await confirmBox('Submit these scores?')) return;
  }
  const all = await sheets('readTab', { tab: 'Submissions' });
  const id = nextId('SUB', all.rows.map(r => r.SubmissionID), 4);
  await sheets('appendRow', { tab: 'Submissions', row: {

    SubmittedAt: nowISO(), ScoresCount: entered, MissingCount: students.length - entered,
    Status: 'Pending', Comment: '', Version: 1
  }});
  await sheets('updateRow', { tab: 'ScoreSheets', matchCol: 'ScoreSheetID', matchVal: scoreSheetId, patch: { Status: 'Submitted', LastModifiedAt: nowISO() } });
  toast('✓ Submitted', 'success');
  S.entryState = null;
  navigate('mySheets');
}

  students.forEach(s => csv.push(`${s.StudentID},${s.FullName},`));
  const blob = new Blob([csv.join('\n')], { type: 'text/csv' });

async function parseBulkPaste() {
  const session = activeSession();
  const cs = $('#buCS').value;
  const assessmentId = $('#buAssessment').value;
  if (!cs || !assessmentId) return toast('Pick all', 'error');
  const [classId] = cs.split('|');
  const text = $('#buPaste').value.trim();
  if (!text) return toast('Paste scores first', 'error');
  const assessment = assessmentById(assessmentId);
  const max = Number(assessment.MaxScore);
  const students = (await sheets('queryTab', { tab: 'Students', where: { SessionID: session.SessionID, ClassID: classId } })).rows;
  const smap = Object.fromEntries(students.map(s => [s.StudentID, s]));
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const parsed = [], errors = [];
  lines.forEach((line, i) => {
    const parts = line.split(',').map(x => x.trim());
    if (parts.length < 2) { errors.push(`Line ${i+1}: needs 2 fields`); return; }
    const [sid, scStr] = parts;
    const st = smap[sid];
    if (!st) { errors.push(`Line ${i+1}: unknown ${sid}`); return; }
    const sc = Number(scStr);
    if (isNaN(sc) || sc < 0 || sc > max) { errors.push(`Line ${i+1}: invalid ${scStr}`); return; }
    parsed.push({ studentId: sid, studentName: st.FullName, score: sc });
  });
  $('#bulkPreview').innerHTML = `
    <div class="card">
      <h2>Preview</h2>
      <p class="meta">✅ ${parsed.length} valid · ❌ ${errors.length} errors</p>
      ${parsed.length ? `<div class="tbl-wrap" style="max-height:300px;overflow-y:auto"><table class="tbl">
        <thead><tr><th>Student</th><th>Score</th></tr></thead>
        <tbody>${parsed.map(p => `<tr><td>${esc(p.studentName)} (${esc(p.studentId)})</td><td><strong>${p.score}</strong></td></tr>`).join('')}</tbody>
      </table></div>` : ''}
      ${errors.length ? `<div class="warn-box" style="margin-top:14px"><pre style="white-space:pre-wrap;font-size:12px">${esc(errors.join('\n'))}</pre></div>` : ''}
      ${parsed.length ? `<div style="margin-top:14px"><button class="btn success" onclick="commitBulkUpload()">✓ Import ${parsed.length} Scores</button></div>` : ''}
    </div>`;
  S.bulkPending = { parsed, cs, assessmentId, max };
}
async function commitBulkUpload() {
  const data = S.bulkPending;
  if (!data) return;
  if (!await confirmBox(`Import ${data.parsed.length} scores?`)) return;
  const session = activeSession();
  const term = currentTerm();
  const [classId, subjectId] = data.cs.split('|');
  let sheet = (await sheets('queryTab', { tab: 'ScoreSheets', where: { SessionID: session.SessionID, TermID: term.TermID, ClassID: classId, SubjectID: subjectId, AssessmentID: data.assessmentId } })).rows[0];
  if (!sheet) {
    const all = await sheets('readTab', { tab: 'ScoreSheets' });
    const id = nextId('SS', all.rows.map(r => r.ScoreSheetID), 4);
    const students = (await sheets('queryTab', { tab: 'Students', where: { SessionID: session.SessionID, ClassID: classId } })).rows.filter(s => String(s.IsActive).toUpperCase() !== 'FALSE');
    await sheets('appendRow', { tab: 'ScoreSheets', row: { ScoreSheetID: id, SessionID: session.SessionID, TermID: term.TermID, ClassID: classId, SubjectID: subjectId, AssessmentID: data.assessmentId, TeacherID: S.user.userId, Status: 'Draft', ScoresEntered: 0, TotalStudents: students.length, CreatedAt: nowISO(), LastModifiedAt: nowISO(), Version: 1 }});
    sheet = { ScoreSheetID: id };
  }
  const existing = (await sheets('queryTab', { tab: 'Scores', where: { ScoreSheetID: sheet.ScoreSheetID } })).rows;
  const map = {};
  existing.forEach(r => { map[r.StudentID + '|' + r.AssessmentID] = r; });
  const allS = await sheets('readTab', { tab: 'Scores' });
  let next = allS.rows.length + 1, created = 0, updated = 0;
  for (const p of data.parsed) {
    const key = p.studentId + '|' + data.assessmentId;
    const row = map[key];
    if (row && String(row.IsDeleted).toUpperCase() !== 'TRUE') {
      await sheets('updateRow', { tab: 'Scores', matchCol: 'ScoreID', matchVal: row.ScoreID, patch: { Score: p.score, MaxScore: data.max, IsValid: true, UpdatedAt: nowISO(), Version: Number(row.Version || 1) + 1 } });
      updated++;
    } else {
      const id = 'SC' + String(next++).padStart(6, '0');
      await sheets('appendRow', { tab: 'Scores', row: { ScoreID: id, ScoreSheetID: sheet.ScoreSheetID, SessionID: session.SessionID, TermID: term.TermID, ClassID: classId, SubjectID: subjectId, AssessmentID: data.assessmentId, StudentID: p.studentId, Score: p.score, MaxScore: data.max, IsValid: true, EnteredBy: S.user.userId, EnteredAt: nowISO(), UpdatedAt: nowISO(), Version: 1, IsDeleted: false }});
      created++;
    }
  }
  await sheets('updateRow', { tab: 'ScoreSheets', matchCol: 'ScoreSheetID', matchVal: sheet.ScoreSheetID, patch: { ScoresEntered: created + updated, LastModifiedAt: nowISO() } });
  S.bulkPending = null;
  toast(`✓ Imported ${created + updated} scores`, 'success');
  navigate('mySheets');
}

async function processStudentImportToClass(rows, sessionId, classId) {
  const errors = [];
  const all = await sheets('readTab', { tab: 'Students' });
  let next = all.rows.length + 1, imported = 0;
  const firstRow = rows[0] || [];
  const header = firstRow.map(x => String(x || '').toLowerCase().replace(/\s+/g, ''));
  const idx = {
    surname: header.indexOf('surname'),
    firstName: header.indexOf('firstname') >= 0 ? header.indexOf('firstname') : header.indexOf('first'),
    middleName: header.indexOf('middlename') >= 0 ? header.indexOf('middlename') : header.indexOf('middle'),
    gender: header.indexOf('gender'),
    fullName: header.indexOf('fullname') >= 0 ? header.indexOf('fullname') : header.indexOf('name')
  };
  const hasHeader = idx.surname >= 0 || idx.fullName >= 0;
  const dataRows = hasHeader ? rows.slice(1) : rows;
  for (let i = 0; i < dataRows.length; i++) {
    const row = dataRows[i];
    try {
      let sur = '', first = '', mid = '', gen = 'M';
      if (hasHeader) {
        sur = idx.surname >= 0 ? String(row[idx.surname] || '').trim() : '';
        first = idx.firstName >= 0 ? String(row[idx.firstName] || '').trim() : '';
        mid = idx.middleName >= 0 ? String(row[idx.middleName] || '').trim() : '';
        gen = idx.gender >= 0 ? String(row[idx.gender] || '').trim() : 'M';
        if (!sur && idx.fullName >= 0) {
          const p = String(row[idx.fullName] || '').trim().split(/\s+/);
          sur = p[0] || ''; first = p[1] || ''; mid = p.slice(2).join(' ');
        }
      } else {
        sur = String(row[0] || '').trim();
        first = String(row[1] || '').trim();
        mid = String(row[2] || '').trim();
        gen = String(row[3] || 'M').trim();
      }
      if (!sur || !first) { errors.push(`Row ${i+1}: missing name`); continue; }
      const id = 'GT' + String(next++).padStart(3, '0');
      const full = [sur, first, mid].filter(Boolean).join(' ');
      await sheets('appendRow', { tab: 'Students', row: {
        StudentID: id, SessionID: sessionId,
        Surname: sur, FirstName: first, MiddleName: mid, FullName: full,
        Gender: gen || 'M', ClassID: classId,
        FeeStatus: '', FeeUpdatedAt: '', FeeUpdatedBy: '',
        IsActive: true, CreatedAt: nowISO()
      }});
      imported++;
    } catch (e) { errors.push(`Row ${i+1}: ${e.message}`); }
  }
  return { ok: imported, errors };
}
