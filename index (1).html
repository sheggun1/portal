  const students = (await sheets('queryTab', { tab: 'Students', where: { SessionID: session.SessionID, ClassID: classId } })).rows.filter(s => String(s.IsActive).toUpperCase() !== 'FALSE').sort((a, b) => (a.FullName || '').localeCompare(b.FullName || ''));
  if (!students.length) return toast('No students', 'warn');
  const existing = (await sheets('queryTab', { tab: 'ClassRemarks', where: { SessionID: session.SessionID, TermID: term.TermID, ClassID: classId } })).rows;
  const rm = {};
  existing.forEach(r => { rm[r.StudentID] = r; });
  S.remarksEntry = { sessionId: session.SessionID, termId: term.TermID, classId, students, rm };
  openModal(`
    <h3>Teacher's Remarks</h3>
    <div style="max-height:500px;overflow-y:auto">
      ${students.map((s, i) => `
        <div style="border:1px solid #e5e7eb;border-radius:8px;padding:10px;margin-bottom:10px">
          <strong>${i + 1}. ${esc(s.FullName)}</strong> <span class="meta">(${esc(s.StudentID)})</span>
          <div class="field" style="margin-top:6px">
            <textarea class="teacherRemarkInput" data-student="${esc(s.StudentID)}" rows="2" style="font-size:13px">${esc((rm[s.StudentID] || {}).TeacherRemark || '')}</textarea>
          </div>
        </div>`).join('')}
    </div>
    <div class="actions">
      <button class="btn secondary" onclick="closeModal()">Close</button>
      <button class="btn success" onclick="saveAllRemarks()">Save All</button>
    </div>`, { large: true });
}
async function saveAllRemarks() {
  const data = S.remarksEntry;
  if (!data) return;
  const inputs = document.querySelectorAll('.teacherRemarkInput');
  const existing = (await sheets('readTab', { tab: 'ClassRemarks' })).rows;
  let next = existing.length + 1, saved = 0;
  for (const inp of inputs) {
    const studentId = inp.dataset.student;
    const text = inp.value.trim();
    if (!text) continue;
    const row = existing.find(r => String(r.SessionID) === String(data.sessionId) && String(r.TermID) === String(data.termId) && r.StudentID === studentId);
    if (row) {
      await sheets('updateRow', { tab: 'ClassRemarks', matchCol: 'RemarkID', matchVal: row.RemarkID, patch: { TeacherRemark: text, TeacherRemarkBy: S.user.userId, UpdatedAt: nowISO() } });
    } else {
      const id = 'CR' + String(next++).padStart(6, '0');
      await sheets('appendRow', { tab: 'ClassRemarks', row: { RemarkID: id, SessionID: data.sessionId, TermID: data.termId, StudentID: studentId, ClassID: data.classId, TeacherRemark: text, PrincipalRemark: '', TeacherRemarkBy: S.user.userId, PrincipalRemarkBy: '', UpdatedAt: nowISO() }});
    }
    saved++;
  }
  closeModal();
  toast(`Saved ${saved} remarks`, 'success');
}

/* ============================================================
 * TEACHER — ATTENDANCE
 * ============================================================ */
async function renderAttendance() {
  const session = activeSession();
  const term = currentTerm();
  if (!session || !term) { $('#pane').innerHTML = '<div class="card"><div class="warn-box">Set active session/term first.</div></div>'; return; }
  const mySubjects = mySubjectAssignments();
  if (!mySubjects.length) { $('#pane').innerHTML = '<div class="card"><div class="warn-box">No subject assignments.</div></div>'; return; }
  const options = mySubjects.map(a => {
    const c = classById(a.ClassID);
    const s = subjectById(a.SubjectID);
    return { key: a.ClassID + '|' + a.SubjectID, label: (c ? c.ClassName : a.ClassID) + ' — ' + (s ? s.SubjectName : a.SubjectID) };
  });
  $('#pane').innerHTML = `
    <div class="card">
      <h2>Attendance</h2>
      <p class="meta" style="margin-bottom:14px">${esc(session.SessionName)} · ${esc(term.TermName)}</p>
      <div class="field"><label>Class & Subject</label>
        <select id="attCS"><option value="">-- pick --</option>
          ${options.map(o => `<option value="${esc(o.key)}">${esc(o.label)}</option>`).join('')}
        </select></div>
      <button class="btn block" onclick="openAttendanceEntry()">Load Students</button>
    </div>
    <div id="attendanceArea"></div>`;
}
async function openAttendanceEntry() {
  const session = activeSession();
  const term = currentTerm();
  const cs = $('#attCS').value;
  if (!cs) return toast('Pick first', 'error');
  const [classId, subjectId] = cs.split('|');
  const students = (await sheets('queryTab', { tab: 'Students', where: { SessionID: session.SessionID, ClassID: classId } })).rows.filter(s => String(s.IsActive).toUpperCase() !== 'FALSE').sort((a, b) => (a.FullName || '').localeCompare(b.FullName || ''));
  if (!students.length) return toast('No students', 'warn');
  const existing = (await sheets('queryTab', { tab: 'Attendance', where: { SessionID: session.SessionID, TermID: term.TermID, ClassID: classId, SubjectID: subjectId } })).rows;
  const map = {};
  existing.forEach(r => { map[r.StudentID] = r; });
  $('#attendanceArea').innerHTML = `
    <div class="card">
      <h2>Attendance — ${students.length} students</h2>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Student</th><th>Days Present</th><th>Days Opened</th></tr></thead>
        <tbody>
          ${students.map(s => {
            const e = map[s.StudentID] || {};
            return `
              <tr>
                <td>${esc(s.FullName)}<br><span class="meta">${esc(s.StudentID)}</span></td>
                <td><input type="number" class="attPresent" data-student="${esc(s.StudentID)}" value="${esc(e.DaysPresent || '')}" style="width:90px;padding:8px"></td>
                <td><input type="number" class="attOpened" data-student="${esc(s.StudentID)}" value="${esc(e.DaysOpened || '')}" style="width:90px;padding:8px"></td>
              </tr>`;
          }).join('')}
        </tbody>
      </table></div>
      <div style="margin-top:14px"><button class="btn success" onclick="saveAttendance('${classId}','${subjectId}')">Save</button></div>
    </div>`;
}
async function saveAttendance(classId, subjectId) {
  const session = activeSession();
  const term = currentTerm();
  const existing = (await sheets('readTab', { tab: 'Attendance' })).rows;
  let next = existing.length + 1, saved = 0;
  const presents = document.querySelectorAll('.attPresent');
  for (const p of presents) {
    const sid = p.dataset.student;
    const present = p.value === '' ? null : Number(p.value);
    const openedEl = document.querySelector(`.attOpened[data-student="${sid}"]`);
    const opened = openedEl && openedEl.value !== '' ? Number(openedEl.value) : null;
    if (present === null && opened === null) continue;
    const row = existing.find(r => String(r.SessionID) === String(session.SessionID) && String(r.TermID) === String(term.TermID) && r.StudentID === sid && String(r.SubjectID) === String(subjectId));
    if (row) {
      await sheets('updateRow', { tab: 'Attendance', matchCol: 'AttendanceID', matchVal: row.AttendanceID, patch: { DaysPresent: present, DaysOpened: opened, EnteredBy: S.user.userId, EnteredAt: nowISO() } });
    } else {
      const id = 'ATT' + String(next++).padStart(5, '0');
      await sheets('appendRow', { tab: 'Attendance', row: { AttendanceID: id, SessionID: session.SessionID, TermID: term.TermID, StudentID: sid, ClassID: classId, SubjectID: subjectId, DaysPresent: present, DaysOpened: opened, EnteredBy: S.user.userId, EnteredAt: nowISO() }});
    }
    saved++;
  }
  toast(`Saved ${saved} records`, 'success');
}

/* ============================================================
 * STUDENT — HOME
 * ============================================================ */
async function renderStudentHome() {
  const studentId = S.user.linkedStudentId || S.user.userId;
  const pubs = await sheets('queryTab', { tab: 'Publications', where: { StudentID: studentId } });
  const visible = pubs.rows.filter(p => String(p.IsVisible).toUpperCase() === 'TRUE');
  const blocked = pubs.rows.filter(p => String(p.IsVisible).toUpperCase() !== 'TRUE');
  const student = S.config.students.find(s => s.StudentID === studentId) || { FullName: S.user.fullName, StudentID: studentId };
  let html = `
    <div class="card">
      <h2>${esc(student.FullName || S.user.fullName)}</h2>
      <p class="meta">ID: <code>${esc(studentId)}</code>${student.ClassID ? ' · Class: <strong>' + esc((classById(student.ClassID) || {}).ClassName || student.ClassID) + '</strong>' : ''}</p>
    </div>`;
  if (!visible.length && !blocked.length) {
    html += '<div class="card"><div class="info-box">No published results yet.</div></div>';
    $('#pane').innerHTML = html;
    return;
  }
  if (blocked.length) {
    html += `
      <div class="card">
        <h2>Withheld</h2>
        <div class="warn-box">Results ready but withheld:
          <ul style="margin:8px 0 0 20px">
            ${blocked.map(b => {
              const sess = sessionById(b.SessionID);
              const term = termById(b.TermID);
              return `<li><strong>${esc((sess || {}).SessionName || '')} · ${esc((term || {}).TermName || '')}</strong> — ${esc(b.BlockReason || 'Contact school')}</li>`;
            }).join('')}
          </ul>
        </div>
      </div>`;
  }
  if (visible.length) {
    html += `
      <div class="card">
        <h2>Published Results (${visible.length})</h2>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Session</th><th>Term</th><th>Published</th><th></th></tr></thead>
          <tbody>
            ${visible.map(p => {
              const sess = sessionById(p.SessionID);
              const term = termById(p.TermID);
              return `
                <tr>
                  <td><strong>${esc((sess || {}).SessionName || p.SessionID)}</strong></td>
                  <td>${esc((term || {}).TermName || p.TermID)}</td>
                  <td class="meta">${fmtDateTime(p.PublishedAt)}</td>
                  <td><button class="btn small" onclick="viewReportCard('${p.SessionID}','${p.TermID}')">📄 View Report</button></td>
                </tr>`;
            }).join('')}
          </tbody>
        </table></div>
      </div>`;
  }
  $('#pane').innerHTML = html;
}

/* ============================================================
 * STUDENT — REPORT CARD
 * ============================================================ */
async function viewReportCard(sessionId, termId) {
  const studentId = S.user.linkedStudentId || S.user.userId;
  showLoading('pane', 'Building report card…');
  const [resultsR, traitsR, skillsR, remarksR, attendanceR, overallR, metaR, pubsR] = await Promise.all([
    sheets('queryTab', { tab: 'Results', where: { StudentID: studentId, SessionID: sessionId, TermID: termId } }),
    sheets('queryTab', { tab: 'StudentTraits', where: { StudentID: studentId, SessionID: sessionId, TermID: termId } }),
    sheets('queryTab', { tab: 'StudentSkills', where: { StudentID: studentId, SessionID: sessionId, TermID: termId } }),
    sheets('queryTab', { tab: 'ClassRemarks', where: { StudentID: studentId, SessionID: sessionId, TermID: termId } }),
    sheets('queryTab', { tab: 'Attendance', where: { StudentID: studentId, SessionID: sessionId, TermID: termId } }),
    sheets('queryTab', { tab: 'OverallPositions', where: { StudentID: studentId, SessionID: sessionId, TermID: termId } }),
    sheets('queryTab', { tab: 'ReportMetadata', where: { SessionID: sessionId, TermID: termId } }),
    sheets('queryTab', { tab: 'Publications', where: { StudentID: studentId, SessionID: sessionId, TermID: termId } })
  ]);
  const pub = pubsR.rows[0];
  if (!pub || String(pub.IsVisible).toUpperCase() !== 'TRUE') return toast('Result withheld', 'error');
  S.currentReport = {
    studentId, sessionId, termId,
    session: sessionById(sessionId),
    term: termById(termId),
    student: S.config.students.find(s => s.StudentID === studentId) || {},
    cls: classById((S.config.students.find(s => s.StudentID === studentId) || {}).ClassID),
    results: resultsR.rows, traits: traitsR.rows, skills: skillsR.rows,
    remarks: remarksR.rows[0] || {}, attendance: attendanceR.rows,
    overall: overallR.rows[0] || {}, meta: metaR.rows[0] || {}
  };
  renderReportCard();
}
function renderReportCard() {
  const r = S.currentReport;
  if (!r) return;
  const T = S.config.template;
  const info = {};
  (S.config.schoolInfo || []).forEach(x => { info[x.FieldKey] = x.FieldValue; });
  const remarks = r.remarks, meta = r.meta, overall = r.overall;
  const cs = S.config.classSubjects.filter(x => String(x.ClassID) === String(r.student.ClassID) && String(x.IsActive).toUpperCase() !== 'FALSE');
  const subjectOrder = cs.length ? cs.map(x => x.SubjectID) : r.results.map(x => x.SubjectID);
  const ordered = [];
  subjectOrder.forEach(sid => {
    const res = r.results.find(x => String(x.SubjectID) === String(sid));
    if (res) ordered.push(res);
  });
  r.results.forEach(res => { if (!ordered.find(x => x.SubjectID === res.SubjectID)) ordered.push(res); });
  const attP = r.attendance.reduce((s, a) => s + (Number(a.DaysPresent) || 0), 0);
  const attO = r.attendance.reduce((s, a) => s + (Number(a.DaysOpened) || 0), 0);
  const attSum = attO > 0 ? `${attP} out of ${attO}` : (r.attendance[0] ? `${r.attendance[0].DaysPresent || 0} out of ${r.attendance[0].DaysOpened || 0}` : '—');
  const totalCum = ordered.reduce((s, x) => s + (Number(x.CumulativeAverage) || 0), 0);
  const avgCum = ordered.length ? Math.round((totalCum / ordered.length) * 100) / 100 : 0;
  const styleVars = `
    --rc-header-bg:${T.colorHeaderBg};
    --rc-header-txt:${T.colorHeaderText};
    --rc-thead-bg:${T.colorTableHeadBg};
    --rc-thead-txt:${T.colorTableHeadTxt};
    --rc-pass-bg:${T.colorPassRowBg};
    --rc-fail-bg:${T.colorFailRowBg};
    --rc-fail-txt:${T.colorFailText};
    --rc-body-txt:${T.colorBodyText};
  `;
  $('#pane').innerHTML = `
    <div class="no-print" style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
      <button class="btn secondary" onclick="navigate('results')">← Back</button>
      <button class="btn" onclick="window.print()">🖨 Print</button>
    </div>
    <div class="rc-wrap" id="reportCard" style="${styleVars}">
      <style>
        #reportCard .rc-header { border-bottom-color: var(--rc-header-bg); }
        #reportCard .rc-header h1 { color: var(--rc-header-bg); }
        #reportCard .rc-header .rc-title { background: var(--rc-header-bg); color: var(--rc-header-txt); }
        #reportCard .rc-subject-table th { background: var(--rc-thead-bg); color: var(--rc-thead-txt); }
        #reportCard .rc-subject-table .row-pass { background: var(--rc-pass-bg); }
        #reportCard .rc-subject-table .row-fail { background: var(--rc-fail-bg); color: var(--rc-fail-txt); }
        #reportCard, #reportCard * { color: var(--rc-body-txt); }
        #reportCard .rc-subject-table th { color: var(--rc-thead-txt); }
        #reportCard .rc-header .rc-title { color: var(--rc-header-txt); }
        #reportCard .rc-section h4 { background: var(--rc-thead-bg); color: var(--rc-thead-txt); }
      </style>
      <div class="rc-header">
        ${T.showLogo && info.LogoURL ? `<img src="${esc(info.LogoURL)}" alt="logo" style="height:60px;margin-bottom:6px">` : ''}
        <h1>${esc(info.SchoolName || 'SCHOOL NAME')}</h1>
        ${T.showAddress ? `<div style="font-size:13px">${esc(info.Address || '')}</div>` : ''}
        ${T.showMotto && info.Motto ? `<div class="rc-motto">${esc(info.Motto)}</div>` : ''}
        ${T.showPhone && info.Phone ? `<div style="font-size:12px">Tel: ${esc(info.Phone)}</div>` : ''}
        ${T.showEmail && info.Email ? `<div style="font-size:12px">${esc(info.Email)}</div>` : ''}
        <div class="rc-title">REPORT SHEET FOR ${esc((r.term || {}).TermName || '').toUpperCase()} ${esc((r.session || {}).SessionName || '')} ACADEMIC SESSION</div>
      </div>
      <div class="rc-student-info">
        <div>
          <div class="row-info"><span>Name of Student:</span><strong>${esc(r.student.FullName || '')}</strong></div>
          <div class="row-info"><span>Current Class:</span><strong>${esc((r.cls || {}).ClassName || '')}</strong></div>
          ${T.showNumInClass ? `<div class="row-info"><span>Number in Class:</span><strong>${esc(overall.ClassSize || '—')}</strong></div>` : ''}
        </div>
        <div>
          ${T.showStudentID ? `<div class="row-info"><span>Student ID:</span><strong>${esc(r.student.StudentID || '')}</strong></div>` : ''}
          ${T.showPosition ? `<div class="row-info"><span>Position:</span><strong>${esc(overall.OverallRank || '—')} of ${esc(overall.ClassSize || '—')}</strong></div>` : ''}
          ${T.showAttendance ? `<div class="row-info"><span>Attendance:</span><strong>${esc(attSum)}</strong></div>` : ''}
        </div>
      </div>
      <table class="rc-subject-table">
        <thead>
          <tr>
            <th rowspan="2" style="width:180px">Subject</th>
            ${(T.colTest1 || T.colTest2 || T.colTest3 || T.colExam) ? `<th colspan="${[T.colTest1,T.colTest2,T.colTest3,T.colExam].filter(Boolean).length}">Current Term Assessments</th>` : ''}
            ${(T.colTermTotal || T.colCumAvg || T.colClassAvg) ? `<th colspan="${[T.colTermTotal,T.colCumAvg,T.colClassAvg].filter(Boolean).length}">Cumulative</th>` : ''}
            ${T.colGrade ? `<th rowspan="2">Grade</th>` : ''}
            ${T.colRank ? `<th rowspan="2">Position</th>` : ''}
            ${T.colRemark ? `<th rowspan="2">Remark</th>` : ''}
          </tr>
          <tr>
            ${T.colTest1 ? '<th>Test 1</th>' : ''}
            ${T.colTest2 ? '<th>Test 2</th>' : ''}
            ${T.colTest3 ? '<th>Test 3</th>' : ''}
            ${T.colExam ? '<th>Exam</th>' : ''}
            ${T.colTermTotal ? '<th>Term Total</th>' : ''}
            ${T.colCumAvg ? '<th>Cum. Avg</th>' : ''}
            ${T.colClassAvg ? '<th>Class Avg</th>' : ''}
          </tr>
        </thead>
        <tbody>
          ${ordered.map(res => {
            const subj = subjectById(res.SubjectID);
            const t = res.Term1Total || res.Term2Total || res.Term3Total || '';
            const rowClass = res.ColorCode === 'red' ? 'row-fail' : 'row-pass';
            return `
              <tr class="${rowClass}">
                <td class="subject-name">${esc(subj ? subj.SubjectName : res.SubjectID)}</td>
                ${T.colTest1 ? `<td>${esc(res.Test1 || 0)}</td>` : ''}
                ${T.colTest2 ? `<td>${esc(res.Test2 || 0)}</td>` : ''}
                ${T.colTest3 ? `<td>${esc(res.Test3 || 0)}</td>` : ''}
                ${T.colExam ? `<td>${esc(res.Exam || 0)}</td>` : ''}
                ${T.colTermTotal ? `<td><strong>${esc(t)}</strong></td>` : ''}
                ${T.colCumAvg ? `<td>${esc(res.CumulativeAverage || '')}</td>` : ''}
                ${T.colClassAvg ? `<td>${esc(res.ClassAverage || '')}</td>` : ''}
                ${T.colGrade ? `<td><strong>${esc(res.Grade || '')}</strong></td>` : ''}
                ${T.colRank ? `<td>${esc(res.SubjectRank || '')}</td>` : ''}
                ${T.colRemark ? `<td>${esc(res.Remark || '')}</td>` : ''}
              </tr>`;
          }).join('')}
          <tr style="font-weight:700;background:#f3f4f6">
            <td class="subject-name">TOTAL / AVERAGE</td>
            ${(T.colTest1 || T.colTest2 || T.colTest3 || T.colExam) ? `<td colspan="${[T.colTest1,T.colTest2,T.colTest3,T.colExam].filter(Boolean).length}"></td>` : ''}
            ${T.colTermTotal ? `<td>${totalCum}</td>` : ''}
            ${T.colCumAvg ? `<td>${avgCum}</td>` : ''}
            ${T.colClassAvg ? `<td></td>` : ''}
            ${T.colGrade ? `<td></td>` : ''}
            ${T.colRank ? `<td></td>` : ''}
            ${T.colRemark ? `<td></td>` : ''}
          </tr>
        </tbody>
      </table>
      ${T.showTraits ? `
        <div class="rc-section">
          <h4>Character Development</h4>
          <div class="rc-grid">
            ${S.config.traits.filter(t => String(t.IsActive).toUpperCase() !== 'FALSE').sort((a, b) => Number(a.DisplayOrder) - Number(b.DisplayOrder)).map(t => {
              const found = r.traits.find(x => String(x.TraitID) === String(t.TraitID));
              return `<div><span>${esc(t.TraitName)}</span><strong>${found ? Number(found.Rating) : '—'}</strong></div>`;
            }).join('')}
          </div>
        </div>` : ''}
      ${T.showSkills ? `
        <div class="rc-section">
          <h4>Psychomotor Skills</h4>
          <div class="rc-grid">
            ${S.config.skills.filter(s => String(s.IsActive).toUpperCase() !== 'FALSE').sort((a, b) => Number(a.DisplayOrder) - Number(b.DisplayOrder)).map(sk => {
              const found = r.skills.find(x => String(x.SkillID) === String(sk.SkillID));
              return `<div><span>${esc(sk.SkillName)}</span><strong>${found ? Number(found.Rating) : '—'}</strong></div>`;
            }).join('')}
          </div>
        </div>` : ''}
      ${T.showRemarks ? `
        <div class="rc-section">
          <h4>Remarks</h4>
          <div style="padding:12px">
            <div style="margin-bottom:10px"><strong>Class Teacher's Remark:</strong> ${esc(remarks.TeacherRemark || '—')}</div>
            <div><strong>Principal's Remark:</strong> ${esc(remarks.PrincipalRemark || '—')}</div>
          </div>
        </div>` : ''}
      ${T.showScale ? `
        <div class="rc-section">
          <h4>Scale</h4>
          <div style="padding:12px;font-size:13px">5 = Excellent · 4 = Very Good · 3 = Good · 2 = Fair · 1 = Poor</div>
        </div>` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px">
        <div>
          <div class="row-info" style="font-size:13px;padding:6px 0;border-bottom:1px dotted #ddd">
            <span>Vacation Date:</span><strong>${esc(meta.VacationDate || (r.term || {}).VacationDate || '—')}</strong>
          </div>
          <div class="row-info" style="font-size:13px;padding:6px 0;border-bottom:1px dotted #ddd">
            <span>Resumption Date:</span><strong>${esc(meta.ResumptionDate || (r.term || {}).ResumptionDate || '—')}</strong>
          </div>
        </div>
        ${T.showSignature ? `
          <div>
            <div class="rc-sig-line">
              <div style="font-weight:600">${esc(meta.PrincipalName || 'Principal')}</div>
              <div style="font-size:12px">Principal's Signature</div>
            </div>
          </div>` : '<div></div>'}
      </div>
    </div>`;
}

(async () => {
  const cached = sessionStorage.getItem('gtmc_user');
  if (cached) {
    try {
      S.user = JSON.parse(cached);
      await initApp();
    } catch (e) {
      sessionStorage.removeItem('gtmc_user');
    }
  }
})();
</script>
